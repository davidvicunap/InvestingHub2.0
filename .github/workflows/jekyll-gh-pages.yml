# Build the Vite (React/TS) terminal in frontend/ and deploy to GitHub Pages.
# The build outputs to docs/ (vite.config: outDir ../docs), which is copied into
# the _site artifact.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions ->
# Variables) so the static site can reach the Render backend:
#   API_BASE  e.g. https://investorhub.onrender.com
#   WS_URL    e.g. wss://investorhub.onrender.com/ws
# (Without these the app falls back to same-origin, which won't reach the API.)
name: Deploy terminal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let in-progress production runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build terminal (Vite)
        working-directory: frontend
        env:
          # GitHub Pages serves this repo under /<repo>/, so the asset base must match.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_WS_URL: ${{ vars.WS_URL }}
        run: npm run build   # outputs to ../docs

      - name: Assemble _site
        run: |
          rm -rf _site && mkdir -p _site
          cp -r docs/. _site/
          touch _site/.nojekyll   # serve files as-is, skip Jekyll processing

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
